name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: o pipeline só lê o repositório (ADR-003 — hardening de CI).
permissions:
  contents: read

# Um run por ref; pushes sucessivos na mesma PR cancelam o anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Toolchain fixado em patch: o build de release precisa ser reprodutível.
  GO_VERSION: "1.27.1"
  # Versões resolvidas em 2026-09-21 via `go list -m -versions`; pinadas para
  # que um release novo do linter não mude o resultado do pipeline sem revisão.
  STATICCHECK_VERSION: "v0.8.1"   # binário reporta 2026.2.1
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  verify:
    name: verify (vet · staticcheck · race+coverage · govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo para o `git describe` do Makefile produzir a
          # versão a partir da tag mais recente.
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          # go.sum é a chave primária do cache de módulos; go.mod fica na lista
          # como fallback para o setup-go não falhar caso o go.sum não exista
          # (bootstrap do módulo).
          cache-dependency-path: |
            go.sum
            go.mod

      - name: go vet
        run: make vet

      - name: staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          staticcheck -version
          make lint

      - name: go test -race com cobertura e piso mínimo
        run: make cover-check

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          gobin="$(go env GOPATH)/bin"
          export PATH="$gobin:$PATH"
          govulncheck -version
          make vuln

      - name: Publicar perfil de cobertura
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  cross-build:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Cross-compile estático (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: make dist PLATFORMS="${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Conferir arquitetura do binário
        run: file dist/heimdall-*-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Publicar binário
        if: ${{ !cancelled() && hashFiles('dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: warn
