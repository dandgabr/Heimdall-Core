# Configuração do staticcheck para o Heimdall Core.
# Referência: https://staticcheck.dev/docs/configuration/
#
# "all" habilita a suíte completa. As exclusões abaixo são o conjunto de
# checagens de estilo (ST1xxx) que o próprio staticcheck desativa por padrão:
# são opinativas e travariam o pipeline por preferência de nomeação, não por
# defeito. Mantemos o mesmo baseline para que o resultado local e o do CI
# coincidam com o comportamento documentado da ferramenta.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
